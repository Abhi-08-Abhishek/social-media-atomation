[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socialix-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "sqlalchemy[asyncio]>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "cryptography>=44",
  "authlib>=1.6,<2",
  "itsdangerous>=2.2,<3",
  "pillow>=11,<13",
  "pyttsx3>=2.98,<3; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
include = ["app*"]
